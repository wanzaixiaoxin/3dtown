<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>古镇漫游 · 3D 古代小镇</title>
<style>
  :root {
    --ink: #2b2118;
    --paper: #f4e9d0;
    --seal: #b5462f;
    --jade: #3f7a63;
    --gold: #d8b25a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1712; }
  body {
    font-family: "PingFang SC", "Songti SC", "STSong", serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .panel {
    position: absolute;
    background: rgba(28, 22, 16, 0.64);
    border: 1px solid rgba(244, 233, 208, 0.22);
    border-radius: 12px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.38);
    pointer-events: auto;
  }
  .brand { top: 18px; left: 18px; padding: 12px 16px 12px 14px; display: flex; align-items: center; gap: 12px; }
  .seal {
    width: 40px; height: 40px; border-radius: 8px; background: var(--seal);
    display: grid; place-items: center; font-size: 20px; font-weight: 700; color: #fbe9dd;
    box-shadow: inset 0 0 0 2px rgba(251,233,221,0.35); flex: none;
  }
  .brand h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: 2px; font-weight: 600; }
  .brand p { margin: 0; font-size: 11px; opacity: 0.65; letter-spacing: 1px; }

  .controls { left: 18px; bottom: 18px; padding: 12px 14px; font-size: 12px; line-height: 1.85; letter-spacing: 0.4px; }
  .controls b { display: block; margin-bottom: 6px; font-size: 11px; opacity: 0.6; letter-spacing: 2px; font-weight: 500; }
  kbd {
    display: inline-block; min-width: 20px; text-align: center; padding: 1px 6px; margin-right: 6px;
    background: rgba(244,233,208,0.12); border: 1px solid rgba(244,233,208,0.25);
    border-bottom-width: 2px; border-radius: 5px; font-family: inherit; font-size: 11px;
  }
  .controls .row { display: flex; align-items: center; gap: 2px; }
  .controls .row span { opacity: 0.82; }

  /* top-right stack */
  .topright { top: 18px; right: 18px; padding: 8px; display: flex; gap: 8px; flex-direction: column; align-items: stretch; }
  .viewtabs { display: flex; padding: 4px; gap: 4px; }
  .btn {
    pointer-events: auto; cursor: pointer;
    border: 1px solid rgba(244,233,208,0.25); background: rgba(244,233,208,0.08);
    color: var(--paper); padding: 8px 14px; border-radius: 9px;
    font-family: inherit; font-size: 13px; letter-spacing: 1px; transition: all .18s ease; white-space: nowrap;
  }
  .btn:hover { background: rgba(244,233,208,0.18); transform: translateY(-1px); }
  .viewtabs .btn { padding: 7px 14px; font-size: 12px; }
  .viewtabs .btn.active { background: var(--seal); border-color: var(--seal); color: #fbe9dd; }

  /* time-of-day buttons */
  .timebar { display: flex; gap: 5px; padding: 4px; }
  .timebar .btn { padding: 6px 9px; font-size: 12px; flex: 1; text-align: center; }
  .timebar .btn.active { background: #4a6a8a; border-color: #4a6a8a; color: #eaf3fb; }

  /* settings drawer */
  #settings { top: 18px; right: 18px; width: 260px; padding: 16px; display: none; }
  #settings.show { display: block; }
  #settings h3 { margin: 0 0 14px; font-size: 13px; letter-spacing: 2px; font-weight: 600; opacity: 0.9; }
  #settings .field { margin-bottom: 16px; }
  #settings .field:last-child { margin-bottom: 0; }
  #settings label { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.75; margin-bottom: 8px; letter-spacing: 0.5px; }
  #settings label b { color: var(--gold); font-weight: 600; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px; border-radius: 3px;
    background: rgba(244,233,208,0.2); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--gold); cursor: pointer; box-shadow: 0 0 0 3px rgba(216,178,90,0.25);
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; opacity: 0.8; margin-bottom: 12px; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-sw { position: absolute; inset: 0; background: rgba(244,233,208,0.2); border-radius: 22px; transition: .2s; cursor: pointer; }
  .slider-sw::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fbe9dd; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider-sw { background: var(--jade); }
  .switch input:checked + .slider-sw::before { transform: translateX(18px); }

  /* minimap */
  .minimap-wrap { right: 18px; bottom: 18px; padding: 8px; }
  .minimap-wrap .mtitle { font-size: 10px; letter-spacing: 3px; opacity: 0.55; margin: 0 0 6px 2px; }
  #minimap { display: block; border-radius: 8px; background: #1d2418; }
  .minimap-wrap .legend { display: flex; gap: 10px; margin-top: 7px; font-size: 10px; opacity: 0.7; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  /* status */
  .status { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 9px 16px; font-size: 11px; letter-spacing: 1px; text-align: center; line-height: 1.7; opacity: 0.92; }
  .status .mode { color: #f3c98c; font-weight: 600; }
  .status .hint { opacity: 0.55; font-size: 10px; }

  /* crosshair */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%); pointer-events: none; z-index: 9; opacity: 0; transition: opacity .25s; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(244,233,208,0.85); box-shadow: 0 0 4px rgba(0,0,0,0.6); }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 1.5px; width: 100%; transform: translateY(-50%); }
  body.fp #crosshair { opacity: 0.85; }

  /* loader */
  #loader { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 40%, #2b2118, #14100b); display: grid; place-items: center; transition: opacity .6s; }
  #loader .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(244,233,208,0.15); border-top-color: var(--seal); animation: spin .9s linear infinite; }
  #loader p { margin-top: 18px; font-size: 13px; letter-spacing: 3px; opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #fallback { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; text-align: center; padding: 30px; background: radial-gradient(circle at 50% 40%, #2b2118, #14100b); }
  #fallback .box { max-width: 460px; }
  #fallback h2 { font-size: 22px; letter-spacing: 4px; margin-bottom: 14px; }
  #fallback p { font-size: 13px; line-height: 2; opacity: 0.7; }
  #fallback .glyph { font-size: 54px; opacity: 0.25; margin-bottom: 10px; }

  @media (max-width: 700px) {
    .controls, .status { display: none; }
    #settings { width: 220px; }
    .minimap-wrap { transform: scale(0.85); transform-origin: bottom right; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="fallback">
    <div class="box">
      <div class="glyph">鎮</div>
      <h2>无法启动三维古镇</h2>
      <p>当前浏览器或设备不支持 WebGL。请尝试使用最新版 Chrome / Edge / Safari，或开启硬件加速后刷新本页面。</p>
    </div>
  </div>

  <div id="loader"><div class="ring"></div><p id="loadText">正在营建古镇…</p></div>
  <div id="crosshair"></div>

  <div class="hud">
    <div class="panel brand">
      <div class="seal">镇</div>
      <div><h1>古镇漫游</h1><p>ANCIENT TOWN · 3D WALKTHROUGH</p></div>
    </div>

    <div class="panel topright">
      <div class="viewtabs">
        <button class="btn active" id="btnTop" data-view="top">俯视角</button>
        <button class="btn" id="btnFp" data-view="fp">第一人称</button>
      </div>
      <div class="timebar">
        <button class="btn" data-time="morning">晨</button>
        <button class="btn active" data-time="noon">午</button>
        <button class="btn" data-time="afternoon">夕</button>
        <button class="btn" data-time="night">夜</button>
      </div>
      <button class="btn" id="btnSettings">⚙ 设置</button>
    </div>

    <div class="panel" id="settings">
      <h3>设置</h3>
      <div class="field">
        <label>鼠标灵敏度 <b id="sensVal">1.0</b></label>
        <input type="range" id="sens" min="0.2" max="3" step="0.1" value="1" />
      </div>
      <div class="field">
        <label>视野 FOV <b id="fovVal">70</b></label>
        <input type="range" id="fov" min="55" max="100" step="1" value="70" />
      </div>
      <div class="field">
        <label>行走速度 <b id="spdVal">3.4</b></label>
        <input type="range" id="spd" min="2" max="6" step="0.2" value="3.4" />
      </div>
      <div class="toggle-row">
        <span>反转 Y 轴</span>
        <label class="switch"><input type="checkbox" id="invertY" /><span class="slider-sw"></span></label>
      </div>
    </div>

    <div class="panel controls">
      <b>操作</b>
      <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移动</span></div>
      <div class="row"><kbd>Shift</kbd><span>奔跑</span></div>
      <div class="row"><kbd>Space</kbd><span>跳跃</span></div>
      <div class="row"><kbd>W</kbd><span>贴近梯子 · 攀爬</span></div>
      <div class="row"><kbd>鼠标</kbd><span>第一人称视角</span></div>
      <div class="row"><kbd>V</kbd><span>切换视角</span></div>
    </div>

    <div class="panel minimap-wrap">
      <div class="mtitle">镇 域 图</div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div class="legend">
        <span><i style="background:#e8b23b"></i>你</span>
        <span><i style="background:#7fd0e8"></i>NPC</span>
        <span><i style="background:#e06b5a"></i>动物</span>
      </div>
    </div>

    <div class="panel status">
      <span>视角 · <span class="mode" id="statMode">俯视</span></span>
      &nbsp;·&nbsp; <span>时辰 · <span id="statTime">正午</span></span>
      &nbsp;·&nbsp; <span>状态 · <span id="statState">驻足</span></span>
      <div class="hint">FPS <span id="statFps">–</span> · 高度 <span id="statY">0.0</span>m · 人物 <span id="statNpc">0</span></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    function showFallback() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('fallback').style.display = 'grid';
    }
    try {
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl) { showFallback(); throw new Error('no-webgl'); }
    } catch (e) { showFallback(); throw e; }
    window.addEventListener('error', (e) => { if (String(e.message || '').includes('three')) showFallback(); });
    import('./main.js').catch((err) => { console.error(err); showFallback(); });
  </script>
</body>
</html>
